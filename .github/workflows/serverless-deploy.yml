name: serverless-deploy

on:
  push:
    branches: [feature-serverless-deploy]

jobs:

  build:
    runs-on: ubuntu-latest
    
    steps:

    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Test Lambda handlers
      run: |
        python -m pip install -r tests/requirements.txt
        python -m unittest discover -s tests -v

    - name: Terraform init and plan
      run: |
            mkdir -p .build
            terraform init -input=false
            terraform validate
            terraform plan -input=false -var-file=env-config/us-east-1/dev.tfvars
            terraform apply -input=false -var-file=env-config/us-east-1/dev.tfvars -auto-approve
            #terraform apply -auto-approve
